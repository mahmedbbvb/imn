name: imn
description: Privacy-First P2P Encrypted Messenger
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # WebRTC
  flutter_webrtc: ^1.6.2+hotfix.2

  # Cryptography
  cryptography: ^2.7.0
  crypto: ^3.0.3

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Networking
  web_socket_channel: ^3.0.1
  connectivity_plus: ^6.0.3

  # Files & Media
  file_picker: ^8.0.7
  image_picker: ^1.1.2
  record: ^5.1.2
  audioplayers: ^6.0.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  collection: ^1.18.0
  rxdart: ^0.27.7
  logger: ^2.3.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
